<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Editor</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
<script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #e8eaf0;
    --text2: #8b92a8;
    --accent: #4f8ef7;
    --accent2: #6ba3ff;
    --green: #3ecf8e;
    --amber: #f59e0b;
    --purple: #a78bfa;
    --coral: #f87171;
    --teal: #2dd4bf;
    --panel-w: 220px;
    --yaml-w: 320px;
    --header-h: 48px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    height: var(--header-h);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
    z-index: 100;
  }
  .logo {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .logo-icon {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  .header-sep { width: 1px; height: 20px; background: var(--border2); }
  .mode-toggle {
    display: flex;
    background: var(--bg3);
    border-radius: 8px;
    padding: 3px;
    border: 1px solid var(--border);
  }
  .mode-btn {
    padding: 4px 12px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    color: var(--text2);
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .btn {
    padding: 6px 12px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    border-radius: 7px;
    cursor: pointer;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    transition: all 0.15s;
  }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent2); }
  .btn.danger { border-color: rgba(248,113,113,0.4); color: var(--coral); }

  /* ── Main layout ── */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* ── Palette ── */
  .palette {
    width: var(--panel-w);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  .panel-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text2);
    padding: 14px 14px 8px;
  }
  .palette-list { padding: 0 8px 8px; flex: 1; overflow-y: auto; }
  .palette-section { margin-bottom: 4px; }
  .palette-section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text2);
    padding: 6px 6px 4px;
    opacity: 0.7;
  }
  .palette-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px;
    border-radius: 7px;
    cursor: grab;
    border: 1px solid transparent;
    transition: all 0.12s;
    margin-bottom: 2px;
    user-select: none;
  }
  .palette-item:hover {
    background: var(--bg3);
    border-color: var(--border);
  }
  .palette-item:active { cursor: grabbing; opacity: 0.8; }
  .palette-dot {
    width: 8px; height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .palette-item-name { font-size: 12px; font-weight: 500; color: var(--text); }
  .palette-item-desc { font-size: 10px; color: var(--text2); margin-top: 1px; }

  /* ── Canvas ── */
  .canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .react-flow__background { background: var(--bg); }
  .react-flow__pane { cursor: default; }

  /* ── Custom nodes ── */
  .pipeline-node {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 10px;
    min-width: 180px;
    max-width: 220px;
    font-family: 'DM Sans', sans-serif;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    transition: border-color 0.15s, box-shadow 0.15s;
    overflow: hidden;
  }
  .pipeline-node:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .pipeline-node.selected {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 2px rgba(79,142,247,0.25), 0 4px 20px rgba(0,0,0,0.5);
  }
  .node-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px 7px;
    border-bottom: 1px solid var(--border);
  }
  .node-icon {
    width: 20px; height: 20px;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
  }
  .node-title { font-size: 12px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-type-badge {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 2px 5px;
    border-radius: 3px;
    opacity: 0.85;
  }
  .node-body { padding: 8px 10px; }
  .node-param { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .node-param-key { font-size: 10px; color: var(--text2); }
  .node-param-val { font-size: 10px; color: var(--text); font-family: 'JetBrains Mono', monospace; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-ports { display: flex; flex-direction: column; gap: 2px; padding: 0 10px 8px; }
  .node-port { font-size: 10px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
  .port-dot { width: 5px; height: 5px; border-radius: 50%; }

  /* React Flow handles */
  .react-flow__handle {
    width: 10px !important; height: 10px !important;
    border-radius: 3px !important;
    border: 1.5px solid var(--border2) !important;
  }
  .react-flow__handle-top { top: -5px !important; }
  .react-flow__handle-bottom { bottom: -5px !important; }
  .react-flow__handle:hover { border-color: var(--accent) !important; }

  /* React Flow edges */
  .react-flow__edge-path { stroke: var(--accent) !important; stroke-width: 1.5 !important; }
  .react-flow__edge.selected .react-flow__edge-path { stroke: var(--accent2) !important; }
  .react-flow__connection-path { stroke: var(--accent) !important; stroke-width: 1.5 !important; }

  /* ── YAML panel ── */
  .yaml-panel {
    width: var(--yaml-w);
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }
  .yaml-header {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .yaml-pre {
    flex: 1;
    overflow: auto;
    padding: 12px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre;
  }
  /* Syntax highlight classes */
  .yaml-key { color: #7dd3fc; }
  .yaml-str { color: #86efac; }
  .yaml-num { color: #fca5a5; }
  .yaml-anchor { color: var(--purple); }
  .yaml-comment { color: #4b5563; font-style: italic; }

  /* ── Config drawer ── */
  .config-drawer {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 280px;
    background: var(--bg2);
    border-left: 1px solid var(--border2);
    z-index: 50;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    box-shadow: -4px 0 20px rgba(0,0,0,0.4);
  }
  .config-drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .drawer-title { font-size: 13px; font-weight: 600; flex: 1; }
  .close-btn {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: none;
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: all 0.12s;
  }
  .close-btn:hover { background: var(--border); color: var(--text); }
  .drawer-body { flex: 1; padding: 14px 16px; overflow-y: auto; }
  .field-group { margin-bottom: 14px; }
  .field-label { font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 5px; letter-spacing: 0.3px; text-transform: uppercase; }
  .field-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.12s;
  }
  .field-input:focus { border-color: var(--accent); }
  .field-textarea {
    min-height: 80px;
    resize: vertical;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.6;
  }
  .field-select {
    appearance: none;
    cursor: pointer;
  }
  .drawer-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }

  /* ── Empty state ── */
  .empty-hint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    opacity: 0.4;
  }
  .empty-hint-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-hint-text { font-size: 13px; color: var(--text2); line-height: 1.6; }

  /* RF controls */
  .react-flow__controls {
    background: var(--bg3) !important;
    border: 1px solid var(--border) !important;
    border-radius: 8px !important;
    box-shadow: none !important;
  }
  .react-flow__controls-button {
    background: transparent !important;
    border-bottom: 1px solid var(--border) !important;
    color: var(--text2) !important;
  }
  .react-flow__controls-button:hover { background: var(--border) !important; }
  .react-flow__controls-button:last-child { border-bottom: none !important; }
  .react-flow__controls-button svg { fill: var(--text2) !important; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* View mode overlay */
  .view-overlay {
    position: absolute; inset: 0; z-index: 10;
    pointer-events: none;
  }
  .view-badge {
    position: absolute; top: 12px; left: 12px;
    background: rgba(15,17,23,0.85);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.4px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { createElement: h, useState, useCallback, useRef, useEffect, useMemo } = React;
const {
  ReactFlow, ReactFlowProvider, addEdge, Background, Controls, MiniMap,
  useNodesState, useEdgesState, Handle, Position, Panel, MarkerType
} = window.ReactFlow;

// ──────────────────────────────────────────
// Node type definitions
// ──────────────────────────────────────────
const NODE_TYPES_DEF = {
  source: {
    label: 'Source',
    color: '#3ecf8e',
    bg: 'rgba(62,207,142,0.15)',
    icon: '⬆',
    category: 'Input / Output',

    defaultParams: { path: 'data/input.parquet', format: 'parquet' },
    ports: { inputs: [], outputs: ['dataframe'] },
  },
  sink: {

    color: '#f87171',
    bg: 'rgba(248,113,113,0.15)',
    icon: '⬇',
    category: 'Input / Output',
    badge: 'SINK',
    defaultParams: { path: 'data/output.parquet', format: 'parquet' },
    ports: { inputs: ['dataframe'], outputs: [] },
  },
  sql: {
    label: 'SQL Transform',
    color: '#f59e0b',
    bg: 'rgba(245,158,11,0.15)',
    icon: '◈',
    category: 'Transform',
    badge: 'SQL',
    defaultParams: { query: 'SELECT * FROM input', dialect: 'duckdb' },

    label: 'Filter',

    category: 'Transform',
    badge: 'PY',

  },

    label: 'Join',
    color: '#a78bfa',

    category: 'Transform',
    badge: 'PY',
    defaultParams: { on: 'id', how: 'inner' },
    ports: { inputs: ['left', 'right'], outputs: ['dataframe'] },
  },

    label: 'Aggregate',
    color: '#2dd4bf',
    bg: 'rgba(45,212,191,0.15)',
    icon: '∑',
    category: 'Transform',
    badge: 'SQL',
    defaultParams: { group_by: 'category', agg: 'sum(value)' },
    ports: { inputs: ['dataframe'], outputs: ['dataframe'] },
  },
  python: {
    label: 'Python',
    color: '#fbbf24',
    bg: 'rgba(251,191,36,0.15)',
    icon: '⟨⟩',
    category: 'Custom',
    badge: 'PY',
    defaultParams: { function: 'transform_fn', module: 'pipeline.transforms' },
    ports: { inputs: ['dataframe'], outputs: ['dataframe'] },
  },
  validate: {
    label: 'Validate',
    color: '#e879f9',
    bg: 'rgba(232,121,249,0.15)',
    icon: '✓',
    category: 'Quality',
    badge: 'PY',
    defaultParams: { schema: 'schemas/output.yaml', strict: 'true' },
    ports: { inputs: ['dataframe'], outputs: ['dataframe'] },
  },
};

const CATEGORIES = ['Input / Output', 'Transform', 'Custom', 'Quality'];

// ──────────────────────────────────────────
// YAML serialisation
// ──────────────────────────────────────────
function flowToYaml(nodes, edges) {
  const pipeline = {
    pipeline: {
      name: 'my_pipeline',
      version: '1.0',
      nodes: {},
      edges: edges.map(e => ({ from: e.source, to: e.target }))
    }
  };
  nodes.forEach(n => {
    pipeline.pipeline.nodes[n.id] = {
      type: n.data.nodeType,
      params: { ...n.data.params }
    };
  });
  return jsyaml.dump(pipeline, { indent: 2, lineWidth: 80 });
}

function highlightYaml(yaml) {
  return yaml
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/^(\s*)([\w_]+)(\s*:)/gm, (_, sp, key, col) =>
      `${sp}<span class="yaml-key">${key}</span>${col}`)
    .replace(/:\s+(.+)$/gm, (m, val) => {
      if (/^['"]/.test(val)) return `: <span class="yaml-str">${val}</span>`;
      if (/^\d/.test(val)) return `: <span class="yaml-num">${val}</span>`;
      if (/^(true|false|null)$/.test(val)) return `: <span class="yaml-num">${val}</span>`;
      return `: <span class="yaml-str">${val}</span>`;
    });
}

// ──────────────────────────────────────────
// Custom node component
// ──────────────────────────────────────────
function PipelineNode({ data, selected }) {
  const def = NODE_TYPES_DEF[data.nodeType] || {};
  const params = data.params || {};
  const paramEntries = Object.entries(params).slice(0, 3);

  return h('div', { className: `pipeline-node ${selected ? 'selected' : ''}`,
    style: { borderColor: selected ? undefined : `${def.color}40` } },
    def.ports.inputs.length > 0 && h(Handle, { type: 'target', position: Position.Top, style: { background: def.color, borderColor: def.color } }),

    h('div', { className: 'node-header' },
      h('div', { className: 'node-icon', style: { background: def.bg } },
        h('span', { style: { color: def.color, fontSize: 10 } }, def.icon)
      ),
      h('div', { className: 'node-title' }, data.label),
      h('div', { className: 'node-type-badge',
        style: { background: `${def.color}20`, color: def.color } }, def.badge)
    ),

    paramEntries.length > 0 && h('div', { className: 'node-body' },
      ...paramEntries.map(([k, v]) =>
        h('div', { className: 'node-param', key: k },
          h('span', { className: 'node-param-key' }, k),
          h('span', { className: 'node-param-val' }, String(v))
        )
      )
    ),

    h('div', { className: 'node-ports' },
      ...def.ports.inputs.map(p =>
        h('div', { className: 'node-port', key: `in-${p}` },
          h('div', { className: 'port-dot', style: { background: def.color, opacity: 0.6 } }),
          h('span', null, p)
        )
      ),
      ...def.ports.outputs.map(p =>
        h('div', { className: 'node-port', key: `out-${p}` },
          h('div', { className: 'port-dot', style: { background: def.color } }),
          h('span', null, p)
        )
      )
    ),

    def.ports.outputs.length > 0 && h(Handle, { type: 'source', position: Position.Bottom, style: { background: def.color, borderColor: def.color } })
  );
}

const nodeTypes = { pipeline: PipelineNode };

// ──────────────────────────────────────────
// Initial example graph
// ──────────────────────────────────────────
const INIT_NODES = [
  { id: 'n1', type: 'pipeline', position: { x: 100, y: 80 },
    data: { nodeType: 'source', label: 'sales_data', params: { path: 'data/sales.parquet', format: 'parquet' } } },
  { id: 'n2', type: 'pipeline', position: { x: 380, y: 80 },
    data: { nodeType: 'source', label: 'product_ref', params: { path: 'data/products.csv', format: 'csv' } } },
  { id: 'n3', type: 'pipeline', position: { x: 240, y: 240 },
    data: { nodeType: 'join', label: 'enrich_sales', params: { on: 'product_id', how: 'inner' } } },
  { id: 'n4', type: 'pipeline', position: { x: 240, y: 400 },
    data: { nodeType: 'filter', label: 'active_only', params: { condition: 'col("active") == True', engine: 'polars' } } },
  { id: 'n5', type: 'pipeline', position: { x: 240, y: 560 },
    data: { nodeType: 'aggregate', label: 'monthly_totals', params: { group_by: 'month, category', agg: 'sum(revenue)' } } },
  { id: 'n6', type: 'pipeline', position: { x: 240, y: 720 },
    data: { nodeType: 'validate', label: 'check_output', params: { schema: 'schemas/report.yaml', strict: 'true' } } },
  { id: 'n7', type: 'pipeline', position: { x: 240, y: 880 },
    data: { nodeType: 'sink', label: 'report_out', params: { path: 'output/monthly.parquet', format: 'parquet' } } },
];

const INIT_EDGES = [
  { id: 'e1', source: 'n1', target: 'n3', type: 'smoothstep', markerEnd: { type: MarkerType.ArrowClosed, color: '#4f8ef7' } },
  { id: 'e2', source: 'n2', target: 'n3', type: 'smoothstep', markerEnd: { type: MarkerType.ArrowClosed, color: '#4f8ef7' } },
  { id: 'e3', source: 'n3', target: 'n4', type: 'smoothstep', markerEnd: { type: MarkerType.ArrowClosed, color: '#4f8ef7' } },
  { id: 'e4', source: 'n4', target: 'n5', type: 'smoothstep', markerEnd: { type: MarkerType.ArrowClosed, color: '#4f8ef7' } },
  { id: 'e5', source: 'n5', target: 'n6', type: 'smoothstep', markerEnd: { type: MarkerType.ArrowClosed, color: '#4f8ef7' } },
  { id: 'e6', source: 'n6', target: 'n7', type: 'smoothstep', markerEnd: { type: MarkerType.ArrowClosed, color: '#4f8ef7' } },
];

// ──────────────────────────────────────────
// Config drawer
// ──────────────────────────────────────────
function ConfigDrawer({ node, onClose, onUpdate }) {
  const [local, setLocal] = useState({});
  const [labelVal, setLabelVal] = useState('');
  const def = node ? NODE_TYPES_DEF[node.data.nodeType] : null;

  useEffect(() => {
    if (node) {
      setLocal({ ...node.data.params });
      setLabelVal(node.data.label);
    }
  }, [node?.id]);

  if (!node) return null;

  return h('div', { className: `config-drawer ${node ? 'open' : ''}` },
    h('div', { className: 'drawer-header' },
      h('div', { className: 'node-icon', style: { background: def.bg, width: 28, height: 28 } },
        h('span', { style: { color: def.color } }, def.icon)
      ),
      h('div', { className: 'drawer-title' }, `Configure: ${def.label}`),
      h('button', { className: 'close-btn', onClick: onClose }, '×')
    ),
    h('div', { className: 'drawer-body' },
      h('div', { className: 'field-group' },
        h('div', { className: 'field-label' }, 'Node ID / label'),
        h('input', {
          className: 'field-input',
          value: labelVal,
          onChange: e => setLabelVal(e.target.value)
        })
      ),
      ...Object.entries(local).map(([k, v]) =>
        h('div', { className: 'field-group', key: k },
          h('div', { className: 'field-label' }, k),
          k === 'query' || k === 'function' ?
            h('textarea', {
              className: 'field-input field-textarea',
              value: v,
              onChange: e => setLocal(p => ({ ...p, [k]: e.target.value }))
            }) :
            k === 'how' ?
              h('select', {
                className: 'field-input field-select',
                value: v,
                onChange: e => setLocal(p => ({ ...p, [k]: e.target.value }))
              },
                ['inner', 'left', 'right', 'outer'].map(opt => h('option', { value: opt, key: opt }, opt))
              ) :
              h('input', {
                className: 'field-input',
                value: v,
                onChange: e => setLocal(p => ({ ...p, [k]: e.target.value }))
              })
        )
      )
    ),
    h('div', { className: 'drawer-footer' },
      h('button', { className: 'btn primary', style: { flex: 1 },
        onClick: () => { onUpdate(node.id, labelVal, local); onClose(); }
      }, 'Apply'),
      h('button', { className: 'btn', onClick: onClose }, 'Cancel')
    )
  );
}

// ──────────────────────────────────────────
// Main app
// ──────────────────────────────────────────
function App() {
  const [mode, setMode] = useState('build');
  const [nodes, setNodes, onNodesChange] = useNodesState(INIT_NODES);
  const [edges, setEdges, onEdgesChange] = useEdgesState(INIT_EDGES);
  const [selectedNode, setSelectedNode] = useState(null);
  const [showYaml, setShowYaml] = useState(true);
  const reactFlowWrapper = useRef(null);
  const [rfInstance, setRfInstance] = useState(null);
  let nodeCounter = useRef(8);

  const yaml = useMemo(() => flowToYaml(nodes, edges), [nodes, edges]);

  const onConnect = useCallback((params) => {
    setEdges(eds => addEdge({
      ...params, type: 'smoothstep',
      markerEnd: { type: MarkerType.ArrowClosed, color: '#4f8ef7' }
    }, eds));
  }, []);

  const onNodeClick = useCallback((_, node) => {
    if (mode === 'build') setSelectedNode(node);
  }, [mode]);

  const onPaneClick = useCallback(() => setSelectedNode(null), []);

  const onDragOver = useCallback((e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }, []);

  const onDrop = useCallback((e) => {
    e.preventDefault();
    const nodeType = e.dataTransfer.getData('application/pipelinenode');
    if (!nodeType || !rfInstance) return;
    const bounds = reactFlowWrapper.current.getBoundingClientRect();
    const position = rfInstance.screenToFlowPosition({
      x: e.clientX - bounds.left,
      y: e.clientY - bounds.top,
    });
    const def = NODE_TYPES_DEF[nodeType];
    const id = `n${nodeCounter.current++}`;
    setNodes(ns => [...ns, {
      id, type: 'pipeline', position,
      data: { nodeType, label: `${def.label.toLowerCase().replace(/ /g,'_')}_${id}`, params: { ...def.defaultParams } }
    }]);
  }, [rfInstance]);

  const updateNode = useCallback((id, label, params) => {
    setNodes(ns => ns.map(n => n.id === id ? { ...n, data: { ...n.data, label, params } } : n));
    setSelectedNode(null);
  }, []);

  const deleteSelected = useCallback(() => {
    if (!selectedNode) return;
    setNodes(ns => ns.filter(n => n.id !== selectedNode.id));
    setEdges(es => es.filter(e => e.source !== selectedNode.id && e.target !== selectedNode.id));
    setSelectedNode(null);
  }, [selectedNode]);

  const nodesWithSelection = useMemo(() =>
    nodes.map(n => ({ ...n, selected: selectedNode?.id === n.id }))
  , [nodes, selectedNode]);

  return h('div', { style: { height: '100vh', display: 'flex', flexDirection: 'column' } },
    // Header
    h('header', null,
      h('div', { className: 'logo' },
        h('div', { className: 'logo-icon' }, '⋈'),
        'PipelineForge'
      ),
      h('div', { className: 'header-sep' }),
      h('div', { className: 'mode-toggle' },
        h('button', { className: `mode-btn ${mode === 'build' ? 'active' : ''}`, onClick: () => setMode('build') }, 'Build'),
        h('button', { className: `mode-btn ${mode === 'view' ? 'active' : ''}`, onClick: () => setMode('view') }, 'View')
      ),
      h('div', { className: 'header-right' },
        selectedNode && mode === 'build' && h('button', { className: 'btn danger', onClick: deleteSelected }, '✕ Delete node'),
        h('button', { className: 'btn', onClick: () => setShowYaml(v => !v) }, showYaml ? '⟨ Hide YAML' : '⟩ Show YAML'),
        h('button', { className: 'btn primary', onClick: () => {
          const blob = new Blob([yaml], { type: 'text/yaml' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'pipeline.yaml';
          a.click();
        }}, '↓ Export YAML')
      )
    ),

    // Main
    h('div', { className: 'main' },
      // Palette (build mode only)
      mode === 'build' && h('div', { className: 'palette' },
        h('div', { className: 'panel-title' }, 'Node Palette'),
        h('div', { className: 'palette-list' },
          ...CATEGORIES.map(cat =>
            h('div', { className: 'palette-section', key: cat },
              h('div', { className: 'palette-section-label' }, cat),
              ...Object.entries(NODE_TYPES_DEF)
                .filter(([, d]) => d.category === cat)
                .map(([type, def]) =>
                  h('div', {
                    key: type,
                    className: 'palette-item',
                    draggable: true,
                    onDragStart: e => e.dataTransfer.setData('application/pipelinenode', type)
                  },
                    h('div', { className: 'palette-dot', style: { background: def.color } }),
                    h('div', null,
                      h('div', { className: 'palette-item-name' }, def.label),
                    )
                  )
                )
            )
          )
        )
      ),

      // Canvas
      h('div', { className: 'canvas-wrap', ref: reactFlowWrapper },
        h(ReactFlow, {
          nodes: nodesWithSelection,
          edges,
          onNodesChange,
          onEdgesChange,
          onConnect,
          onNodeClick,
          onPaneClick,
          onInit: setRfInstance,
          onDrop,
          onDragOver,
          nodeTypes,
          fitView: true,
          fitViewOptions: { padding: 0.2 },
          nodesDraggable: mode === 'build',
          nodesConnectable: mode === 'build',
          elementsSelectable: mode === 'build',
          proOptions: { hideAttribution: true },
        },
          h(Background, { color: 'rgba(255,255,255,0.04)', gap: 20, size: 1 }),
          h(Controls, { showInteractive: false }),
          h(MiniMap, {
            style: { background: '#161b27', border: '1px solid rgba(255,255,255,0.08)' },
            nodeColor: n => (NODE_TYPES_DEF[n.data?.nodeType]?.color || '#888') + '80',
            maskColor: 'rgba(15,17,23,0.7)'
          }),

          nodes.length === 0 && mode === 'build' && h(Panel, { position: 'top-center' },
            h('div', { className: 'empty-hint' },
              h('div', { className: 'empty-hint-icon' }, '⟨⟩'),
              h('div', { className: 'empty-hint-text' }, 'Drag nodes from the palette\nto start building your pipeline')
            )
          ),

          mode === 'view' && h(Panel, { position: 'top-left' },
            h('div', { className: 'view-badge' }, '● VIEW ONLY')
          )
        ),

        // Config drawer
        mode === 'build' && h(ConfigDrawer, {
          node: selectedNode,
          onClose: () => setSelectedNode(null),
          onUpdate: updateNode,
        })
      ),

      // YAML panel
      showYaml && h('div', { className: 'yaml-panel' },
        h('div', { className: 'yaml-header' },
          h('div', { className: 'panel-title', style: { padding: 0 } }, 'Pipeline YAML'),
          h('div', { style: { fontSize: 10, color: 'var(--text2)' } }, `${nodes.length} nodes · ${edges.length} edges`)
        ),
        h('div', { className: 'yaml-pre',
          dangerouslySetInnerHTML: { __html: highlightYaml(yaml.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')) }
        })
      )
    )
  );
}

function Root() {
  return h(ReactFlowProvider, null, h(App));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(Root));
</script>
</body>
</html>
